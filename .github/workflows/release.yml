name: Plugin Release

# 本仓库只有 V3 索引，发布单元就是 package.v3.json 里声明的版本。
# Tag 与产物命名与官方仓一致：PluginID_vX.Y.Z / pluginid_vX.Y.Z.zip，
# MoviePilot 的 Release 安装链路按这个格式匹配历史版本。
#
# 遍历 package.v3.json 中的全部插件，新增插件无需改动本文件。

on:
  push:
    branches:
      - main
    paths:
      - 'package.v3.json'
      - 'plugins.v3/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_FILE: package.v3.json
  PLUGIN_ROOT: plugins.v3

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验索引与插件声明一致
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json, os, sys
          from pathlib import Path

          root = Path(os.environ["PLUGIN_ROOT"])
          package = json.loads(Path(os.environ["PACKAGE_FILE"]).read_text(encoding="utf-8"))

          def resolve_dir(plugin_id: str):
              candidate = root / plugin_id.lower()
              if (candidate / "__init__.py").is_file():
                  return candidate
              for d in sorted(root.iterdir()):
                  init = d / "__init__.py"
                  if init.is_file() and f"class {plugin_id}(" in init.read_text(encoding="utf-8"):
                      return d
              return None

          failed = False
          for plugin_id, meta in package.items():
              plugin_dir = resolve_dir(plugin_id)
              init_file = plugin_dir / "__init__.py"

              tree = ast.parse(init_file.read_text(encoding="utf-8"), filename=str(init_file))
              declared = {}
              for node in tree.body:
                  if not (isinstance(node, ast.ClassDef) and node.name == plugin_id):
                      continue
                  for item in node.body:
                      if not isinstance(item, ast.Assign):
                          continue
                      for target in item.targets:
                          if isinstance(target, ast.Name) and isinstance(item.value, ast.Constant):
                              declared[target.id] = item.value.value

              errors = []
              for attr, field in (("plugin_name", "name"),
                                  ("plugin_version", "version"),
                                  ("plugin_author", "author")):
                  if declared.get(attr) != meta.get(field):
                      errors.append(f"{field}: 索引={meta.get(field)!r} 源码={declared.get(attr)!r}")

              history = list(meta.get("history") or {})
              if not history or history[0] != f"v{meta.get('version')}":
                  errors.append(f"history 首项应为 v{meta.get('version')}，实际为 {history[:1]}")

              numbers = [tuple(int(p) for p in key.lstrip("v").split("."))
                         for key in history if key.lstrip("v").replace(".", "").isdigit()]
              if numbers != sorted(numbers, reverse=True):
                  errors.append("history 未按语义版本降序排列")

              if errors:
                  failed = True
                  print(f"版本门禁失败：{plugin_id}")
                  for e in errors:
                      print(f"- {e}")
              else:
                  print(f"版本门禁通过：{plugin_id} v{meta['version']}")

          sys.exit(1 if failed else 0)
          PY

      - name: 语法编译检查
        run: python -m compileall -q "$PLUGIN_ROOT"

      - name: 打包并创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo_root="$PWD"

          python - <<'PY' > /tmp/plan.tsv
          import json, os
          from pathlib import Path
          root = Path(os.environ["PLUGIN_ROOT"])
          package = json.loads(Path(os.environ["PACKAGE_FILE"]).read_text(encoding="utf-8"))
          def resolve_dir(pid):
              c = root / pid.lower()
              if (c / "__init__.py").is_file():
                  return c
              for d in sorted(root.iterdir()):
                  init = d / "__init__.py"
                  if init.is_file() and f"class {pid}(" in init.read_text(encoding="utf-8"):
                      return d
              return None
          for pid, meta in package.items():
              d = resolve_dir(pid)
              print("\t".join([pid, str(d), str(meta["version"])]))
          PY

          while IFS=$'\t' read -r plugin_id plugin_dir version; do
            [ -z "$plugin_id" ] && continue
            tag="${plugin_id}_v${version}"
            module="$(basename "$plugin_dir")"
            asset="${module}_v${version}.zip"
            notes="$(PID="$plugin_id" python -c 'import json,os;m=json.load(open(os.environ["PACKAGE_FILE"],encoding="utf-8"))[os.environ["PID"]];print((m.get("history") or {}).get("v"+str(m["version"])) or "Automated release")')"

            echo "---- $plugin_id v$version ----"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag 已存在，跳过（版本号未变更则不重复发布）"
              continue
            fi

            # 包内顶层必须是插件目录本身（如 cmsnotify/__init__.py），
            # 因此从 plugins.v3 内打包，避免带上 plugins.v3/ 前缀
            rm -f "$repo_root/$asset"
            (cd "$plugin_dir/.." && zip -r "$repo_root/$asset" "$module" \
              -x "*/__pycache__/*" -x "*.pyc" >/dev/null)

            gh release create "$tag" "$repo_root/$asset" \
              --title "$tag" --notes "$notes" --target "$GITHUB_SHA"
            echo "已发布 $tag -> $asset"
          done < /tmp/plan.tsv
